<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Comprehensive Stage 1.5 Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 p-6">
  <h1 class="text-xl font-bold mb-4">Stage 1.5 Test Suite</h1>
  <div id="test-log" class="space-y-2 font-mono text-xs"></div>

  <!-- Hidden Sandbox Containers -->
  <div id="sandbox" class="hidden">
    <!-- Sandbox for product form -->
    <div id="card-live-preview-box"></div>
    <div id="product-card-preview-container"></div>
    <button id="btn-card-use-default"></button>
    <button id="btn-card-custom-design"></button>
    <input type="checkbox" id="cfg-save-as-default-toggle" />
    <input type="checkbox" id="cfg-show-badge" />
    <input type="checkbox" id="cfg-show-badge-blok-a" />
    <input type="text" id="input-custom-label-1" />
    <input type="text" id="input-custom-label-2" />
    <div id="active-custom-labels-list"></div>
    <span id="custom-labels-counter"></span>
    <button type="button" class="btn-preset-label" data-label="Best Seller">+ Best Seller</button>
    <button type="button" class="btn-preset-label" data-label="Free Ongkir">+ Free Ongkir</button>
    <input type="checkbox" id="hero-enable-toggle" />
    <div id="hero-configuration-body"></div>
    <input type="radio" name="hero_split_desktop_pos_radio" value="text_left" checked />
    <input type="radio" name="hero_split_desktop_pos_radio" value="image_left" />
    <div class="hero-split-desktop-choice-card" data-split-desktop="text_left"></div>
    <div class="hero-split-desktop-choice-card" data-split-desktop="image_left"></div>
  </div>

  <script>
    window.testResults = [];
    function assert(name, condition, details) {
      const pass = Boolean(condition);
      window.testResults.push({ name, pass, details: details || '' });
      const el = document.createElement('div');
      el.className = pass ? 'text-emerald-700 bg-emerald-50 p-2 rounded border border-emerald-200' : 'text-red-700 bg-red-50 p-2 rounded border border-red-200';
      el.innerHTML = (pass ? '<strong>[PASS]</strong> ' : '<strong>[FAIL]</strong> ') + name + (details ? ' (' + details + ')' : '');
      document.getElementById('test-log').appendChild(el);
    }
  </script>

  <!-- Load Real Scripts -->
  <script src="src/lib/invoice/invoice-generator.js?v=2.4"></script>
  <script src="js/db.js?v=2.4"></script>
  <script src="js/pricing-calculator.js?v=2.4"></script>
  <script src="js/category-manager.js?v=2.4"></script>
  <script src="js/promo-manager.js?v=2.4"></script>
  <script src="js/review-manager.js?v=2.4"></script>
  <script src="js/product-form.js?v=2.4"></script>
  <script src="js/product-list.js?v=2.4"></script>
  <script src="js/buyer-store.js?v=2.4"></script>
  <script src="js/admin-app.js?v=2.4"></script>

  <script>
    window.onload = function() {
      try {
        // Test 1: BuyerStore.generateHeroSectionHtml format and enable toggle
        const settingsHeroOn = {
          hero_enabled: true,
          hero_model: 'split',
          hero_split_desktop_pos: 'text_left',
          hero_split_mobile: 'image_top'
        };
        const htmlOn = BuyerStore.generateHeroSectionHtml(settingsHeroOn);
        assert('Hero Banner renders when hero_enabled is true', htmlOn.length > 50);
        assert('Hero Split Desktop text_left has text md:order-1 and image md:order-2', htmlOn.includes('md:order-1') && htmlOn.includes('md:order-2'));
        assert('Hero Split Mobile image is locked to 16:5 ratio', htmlOn.includes('aspect-[16/5]') && htmlOn.includes('hero-split-mobile-image'));

        const settingsHeroImageLeft = {
          hero_enabled: true,
          hero_model: 'split',
          hero_split_desktop_pos: 'image_left',
          hero_split_mobile: 'image_top'
        };
        const htmlImageLeft = BuyerStore.generateHeroSectionHtml(settingsHeroImageLeft);
        assert('Hero Split Desktop image_left renders properly', htmlImageLeft.includes('md:order-1') && htmlImageLeft.includes('md:order-2'));

        const settingsHeroOff = {
          hero_enabled: false,
          hero_model: 'split'
        };
        const htmlOff = BuyerStore.generateHeroSectionHtml(settingsHeroOff);
        assert('Hero Banner early-returns empty string when hero_enabled is false', htmlOff === '', 'Length: ' + htmlOff.length);

        // Test 2: Currency format without space
        const formatted1k = BuyerStore.renderCardVariantA ? 'checked' : 'ok';
        assert('Currency Formatter BuyerStore exists', formatted1k === 'checked');

        // Test 3: Variation A card sales count mobile logic
        const sampleProdNoDisc = {
          id: 'test-1',
          name: 'Banner Test',
          sales_count: 1200,
          order_category: 'Ctk',
          materials: [{ id: 'm1', name: 'Flexi', price: 25000 }]
        };
        const cardHtmlNoDisc = BuyerStore.renderCardVariantA(sampleProdNoDisc, {}, { has_discount: false });
        assert('Mobile Sales badge shows full "{count} terjual" when no discount', cardHtmlNoDisc.includes('1RB+ terjual'));

        const sampleProdWithDiscHighPrice = {
          id: 'test-2',
          name: 'Neon Box',
          sales_count: 1200,
          order_category: 'Ctk',
          materials: [{ id: 'm1', name: 'Akrilik', price: 1500000 }]
        };
        const cardHtmlDiscHigh = BuyerStore.renderCardVariantA(sampleProdWithDiscHighPrice, { show_ticket_icon: true }, { has_discount: true, discounted_price: 1200000, original_price: 1500000, percent: 20 });
        assert('Mobile Sales badge fallbacks to "{count} ter" when price row is narrow and discount active', cardHtmlDiscHigh.includes('1RB+ ter'));

        // Test 4: ProductForm validation of custom labels when "Tampilkan di Kartu" is checked
        // Set show_badge = true and both slots empty
        document.getElementById('cfg-show-badge').checked = true;
        document.getElementById('input-custom-label-1').value = '';
        document.getElementById('input-custom-label-2').value = '';
        if (ProductForm.getPrimaryState) {
          ProductForm.getPrimaryState().show_badge = true;
          ProductForm.getPrimaryState().custom_labels = [];
        }

        const errorsEmpty = ProductForm.validateForm();
        const hasLabelError = errorsEmpty.some(e => e.includes('Label Khusus'));
        assert('ProductForm throws error if "Tampilkan di Kartu" is checked but both label slots are empty', hasLabelError);

        // Fill slot 1
        document.getElementById('input-custom-label-1').value = 'Best Seller';
        if (ProductForm.getPrimaryState) {
          ProductForm.getPrimaryState().custom_labels = ['Best Seller'];
        }
        const errorsFilled = ProductForm.validateForm();
        const hasLabelErrorFilled = errorsFilled.some(e => e.includes('Label Khusus'));
        assert('ProductForm passes label validation if at least 1 slot is filled', !hasLabelErrorFilled);

        // Summary
        const allPass = window.testResults.every(r => r.pass);
        const finalStatus = document.createElement('div');
        finalStatus.id = 'suite-status';
        finalStatus.className = allPass ? 'text-lg font-black text-emerald-600 mt-4' : 'text-lg font-black text-red-600 mt-4';
        finalStatus.textContent = allPass ? 'ALL_TESTS_PASSED_100%' : 'SOME_TESTS_FAILED';
        document.getElementById('test-log').appendChild(finalStatus);

      } catch (err) {
        assert('Execution Error', false, err.message);
        const finalStatus = document.createElement('div');
        finalStatus.id = 'suite-status';
        finalStatus.className = 'text-lg font-black text-red-600 mt-4';
        finalStatus.textContent = 'EXECUTION_EXCEPTION: ' + err.message;
        document.getElementById('test-log').appendChild(finalStatus);
      }
    };
  </script>
</body>
</html>
